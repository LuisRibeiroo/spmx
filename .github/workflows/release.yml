name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, Test & Publish Universal macOS Release
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print toolchain version
        run: |
          swift --version
          xcodebuild -version

      - name: Run test suite
        run: swift test

      - name: Build Universal Binary (arm64 + x86_64)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Package release archive and SHA-256 checksum
        run: |
          set -euo pipefail
          BIN_DIR="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          BINARY_PATH="${BIN_DIR}/pspm"
          if [ ! -f "${BINARY_PATH}" ]; then
            echo "Error: Universal binary not found at ${BINARY_PATH}" >&2
            exit 1
          fi

          lipo -info "${BINARY_PATH}"

          mkdir -p dist
          cp "${BINARY_PATH}" dist/pspm
          chmod 755 dist/pspm

          (
            cd dist
            tar -czf pspm-macos-universal.tar.gz pspm
            shasum -a 256 pspm-macos-universal.tar.gz > pspm-macos-universal.tar.gz.sha256
            rm -f pspm
          )

          cat dist/pspm-macos-universal.tar.gz.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pspm-macos-universal
          path: |
            dist/pspm-macos-universal.tar.gz
            dist/pspm-macos-universal.tar.gz.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/pspm-macos-universal.tar.gz
            dist/pspm-macos-universal.tar.gz.sha256

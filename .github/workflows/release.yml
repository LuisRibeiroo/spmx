name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g. v0.1.1 or 0.1.1). Leave empty for automatic semver bump."
        required: false
        default: ""
        type: string
      bump:
        description: "Automatic semver increment when 'version' is empty (default: patch)"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Build, Test & Publish Universal macOS Release
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "push" ] && [[ "${REF}" == refs/tags/v* ]]; then
            TAG="${REF_NAME}"
            VERSION="${TAG#v}"
          else
            git fetch --tags --force
            LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            LATEST_TAG="${LATEST_TAG:-v0.0.0}"

            TRIMMED_VERSION="$(printf '%s' "${INPUT_VERSION}" | xargs)"
            if [ -n "${TRIMMED_VERSION}" ] && [[ ! "${TRIMMED_VERSION}" =~ ^(patch|minor|major)$ ]]; then
              VERSION="${TRIMMED_VERSION#v}"
              if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                echo "::error::Invalid version '${INPUT_VERSION}'. Expected semver like v0.1.1 or 0.1.1." >&2
                exit 1
              fi
              TAG="v${VERSION}"
            else
              BUMP="${TRIMMED_VERSION:-${INPUT_BUMP:-patch}}"
              BASE="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE}"
              case "${BUMP}" in
                patch)
                  PATCH=$((PATCH + 1))
                  ;;
                minor)
                  MINOR=$((MINOR + 1))
                  PATCH=0
                  ;;
                major)
                  MAJOR=$((MAJOR + 1))
                  MINOR=0
                  PATCH=0
                  ;;
                *)
                  echo "::error::Invalid bump type '${BUMP}'." >&2
                  exit 1
                  ;;
              esac
              VERSION="${MAJOR}.${MINOR}.${PATCH}"
              TAG="v${VERSION}"
            fi

            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "::error::Tag ${TAG} already exists." >&2
              exit 1
            fi

            sed -i '' -E "s/version: \"[^\"]+\"/version: \"${VERSION}\"/" Sources/spmx/SPMXCommand.swift
            grep -q "version: \"${VERSION}\"" Sources/spmx/SPMXCommand.swift
            sed -i '' -E "s/public static let current = \"[^\"]+\"/public static let current = \"${VERSION}\"/" Sources/SPMXCore/Install/UpgradeManager.swift
            grep -q "public static let current = \"${VERSION}\"" Sources/SPMXCore/Install/UpgradeManager.swift
          fi

          echo "Resolved release version: ${VERSION} (tag: ${TAG})"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
          } >> "${GITHUB_OUTPUT}"

      - name: Print toolchain version
        run: |
          swift --version
          xcodebuild -version

      - name: Run test suite
        run: swift test

      - name: Build Universal Binary (arm64 + x86_64)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Package release archive and SHA-256 checksum
        run: |
          set -euo pipefail
          BIN_DIR="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          BINARY_PATH="${BIN_DIR}/spmx"
          if [ ! -f "${BINARY_PATH}" ]; then
            echo "Error: Universal binary not found at ${BINARY_PATH}" >&2
            exit 1
          fi

          lipo -info "${BINARY_PATH}"

          mkdir -p dist
          cp "${BINARY_PATH}" dist/spmx
          chmod 755 dist/spmx

          (
            cd dist
            tar -czf spmx-macos-universal.tar.gz spmx
            shasum -a 256 spmx-macos-universal.tar.gz > spmx-macos-universal.tar.gz.sha256
            rm -f spmx
          )

          cat dist/spmx-macos-universal.tar.gz.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spmx-macos-universal
          path: |
            dist/spmx-macos-universal.tar.gz
            dist/spmx-macos-universal.tar.gz.sha256

      - name: Create and push tag (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SHA256="$(awk '{print $1}' dist/spmx-macos-universal.tar.gz.sha256)"
          sed -i '' -E "s/^([[:space:]]*version \")[^\"]+(\")/\1${VERSION}\2/" Formula/spmx.rb
          sed -i '' -E "s/^([[:space:]]*sha256 \")[^\"]+(\")/\1${SHA256}\2/" Formula/spmx.rb
          grep -q "version \"${VERSION}\"" Formula/spmx.rb
          grep -q "sha256 \"${SHA256}\"" Formula/spmx.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/spmx/SPMXCommand.swift Sources/SPMXCore/Install/UpgradeManager.swift Formula/spmx.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${TAG}"
            if ! git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "::warning::Could not push release bump commit to ${TARGET_BRANCH} (likely protected by branch rules). Tag ${TAG} will still be pushed."
            fi
          fi

          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/spmx-macos-universal.tar.gz
            dist/spmx-macos-universal.tar.gz.sha256

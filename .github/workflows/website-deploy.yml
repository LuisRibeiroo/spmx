name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "bench/results/latest.json"
      - "assets/**"
      - "Sources/spmx/SPMXCommand.swift"
      - ".github/workflows/website-deploy.yml"
  pull_request:
    paths:
      - "website/**"
      - "bench/results/latest.json"
      - "assets/**"
      - "Sources/spmx/SPMXCommand.swift"
      - ".github/workflows/website-deploy.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Release"
    types:
      - completed

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & Typecheck
        run: pnpm run lint && pnpm run typecheck

      - name: Build static site
        env:
          SITE_URL: ${{ github.event_name == 'pull_request' && 'https://preview.spmx-website.pages.dev' || 'https://spmx.io' }}
        run: pnpm run build

      - name: Check contrast and hardcoded numbers
        run: pnpm run check

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: pages deploy out --project-name=spmx-website --branch=${{ github.event_name == 'pull_request' && 'preview' || 'main' }}

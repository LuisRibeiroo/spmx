name: Website CI & Lighthouse

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "bench/results/latest.json"
      - "assets/**"
      - "Sources/spmx/SPMXCommand.swift"
      - ".github/workflows/website-ci.yml"
  pull_request:
    paths:
      - "website/**"
      - "bench/results/latest.json"
      - "assets/**"
      - "Sources/spmx/SPMXCommand.swift"
      - ".github/workflows/website-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lint, Build & Lighthouse CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build static site
        env:
          SITE_URL: http://localhost:3000
        run: pnpm run build

      - name: Check contrast and hardcoded numbers
        run: pnpm run check

      - name: Run Lighthouse CI
        run: pnpm dlx @lhci/cli@0.14.x autorun

      - name: Upload Lighthouse CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouseci-reports
          path: website/.lighthouseci
          retention-days: 14

name: Bug report
description: Report a bug or unexpected behavior in spmx
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Commands run, project type (SwiftPM / Xcode / Flutter), and how to reproduce the issue.
      placeholder: |
        1. Project type (SwiftPM / Xcode / Flutter):
        2. Run `...`
        3. Observe error: `...`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Xcode/Swift version, Flutter version (if applicable), architecture (`arm64` / `x86_64`), and `spmx --version`.
      placeholder: "macOS 15.x (arm64), Xcode 16.x, Swift 6.x, spmx 0.1.0"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `spmx doctor`
      description: Paste the output of `spmx doctor` (optional, helpful for PATH/APFS/shim issues).
      render: shell
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Any relevant output with `SPMX_VERBOSE=1` enabled (optional).
      render: shell
    validations:
      required: false
